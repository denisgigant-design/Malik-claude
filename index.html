<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Malik's Barbers</title>
<meta name="description" content="Step inside Malik's Barbers: opening hours, booking and prices.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader"><b>MALIK'S</b><i><span id="bar"></span></i><small id="pct"></small></div>

<main id="scroll">
  <div id="stage">
    <video id="vid" muted playsinline preload="auto" disablepictureinpicture></video>
    <div class="shade"></div>

    <button id="welcome" aria-label="Welcome, scroll to enter"><span class="ring"></span><span class="ring r2"></span><b>Welcome</b><small>Scroll to step inside ↓</small></button>

    <section class="panel center" id="hours">
      <div class="card-head"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><h2>Opening Hours</h2></div>
      <div class="status" id="status"><i></i><span></span></div>
      <div class="week" id="week"></div>
      <div class="tools"><button id="fmt">24h</button><button id="cpH">Copy hours</button></div>
    </section>

    <section class="panel left" id="book">
      <div class="card-head"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><h2>Book Your Chair</h2></div>
      <ol class="steps" id="steps"></ol>
      <a class="btn" id="bookBtn" href="#">Book online</a>
      <p class="sub" id="walk"></p>
    </section>

    <section class="panel right" id="price">
      <div class="card-head"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12.6 3.5h5a1 1 0 0 1 1 1v5a1 1 0 0 1-.3.7l-8.2 8.2a1 1 0 0 1-1.4 0l-5.3-5.3a1 1 0 0 1 0-1.4l8.2-8.2a1 1 0 0 1 .7-.3z"/><circle cx="16.3" cy="7.7" r="1.3"/></svg></span><h2>Prices</h2></div>
      <ul class="prices" id="prices"></ul>
      <p class="sub" id="contact"></p>
    </section>

    <div id="rail"></div>
    <div id="brand">MALIK'S BARBERS</div><div id="chapter"></div><div id="rewind">⏪ Rewinding</div><div id="toast"></div><div id="stats"></div>
    <div id="hint">Scroll ↓</div>
    <div id="help" hidden><b>Shortcuts</b><br>← → or 1-4 jump · Space next · T auto-tour · Shift slow · F stats · P screenshot · Q lite mode · Esc close</div>
    <div id="cta"><a id="cBook" href="#">Book</a><a id="cCall" href="#">Call</a><a id="cMap" href="#" target="_blank" rel="noopener">Directions</a><a id="cWa" hidden href="#">WhatsApp</a><button id="cCopy">Copy</button><button id="cShare">Share</button><button id="cTop">↑ Start</button></div>
    <nav id="dots" aria-label="Sections"></nav>
  </div>
</main>
<noscript><p style="padding:20px;color:#fff">Please enable JavaScript to take the tour.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="config.js"></script>
<script src="main.js"></script>
<script src="fx.js"></script>
<script src="fx2.js"></script>
</body>
</html>
